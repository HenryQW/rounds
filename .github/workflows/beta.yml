name: Beta

# Each push to main that changes more than docs or the website builds Rounds like a release and publishes it on the rolling prerelease
# "beta": Rounds-<version>.dmg and appcast.xml, the feed of the Beta update channel (spec 5.8). Version: <last tag>.<commits
# since it>, so it is above that release and below the next one; on a tagged commit it is the release version. A
# prerelease is never the latest release, so the Stable channel, the download link and the cask do not change.
on:
  push:
    branches: [main]
    # A docs or website change makes no new app. A release tag has its own workflow, which also fills the beta release.
    paths-ignore: ["**.md", "docs/**", "website/**", ".claude/**", "packaging/dmg/**"]

permissions:
  contents: read

concurrency:
  group: beta
  cancel-in-progress: true

jobs:
  harness-host:
    uses: ./.github/workflows/build-harness-host.yml

  beta:
    needs: harness-host
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the version and the notes need the last tag and the commits since it

      - name: Set the version
        run: |
          TAG="$(git describe --tags --abbrev=0 --match 'v*')"
          COUNT="$(git rev-list --count "$TAG..HEAD")"
          SHA="$(git rev-parse --short HEAD)"
          if [ "$COUNT" = 0 ]; then VERSION="${TAG#v}"; else VERSION="${TAG#v}.$COUNT"; fi
          { echo "TAG=$TAG"; echo "ROUNDS_VERSION=$VERSION"; echo "ROUNDS_SHORT_VERSION=$VERSION beta ($SHA)"; } >> "$GITHUB_ENV"

      - name: Test
        # A parallel run makes the Git and timing tests time out under load.
        run: swift test --no-parallel

      - name: Require the Harness payload artifact
        env:
          PAYLOAD_ID: ${{ needs.harness-host.outputs.payload-id }}
        run: test -n "$PAYLOAD_ID"

      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.harness-host.outputs.payload-id }}
          path: ${{ runner.temp }}/rounds-harness-host
          digest-mismatch: error

      - name: Import the signing identity
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: scripts/import-identity.sh

      - name: Build the app and the disk image
        run: |
          scripts/bundle.sh --harness-payload "$RUNNER_TEMP/rounds-harness-host"
          # Use the same release identity and Linear Keychain helper as Stable.
          codesign -dvv build/Rounds.app 2>&1 | grep -x "Authority=Rounds Self-Signed" > /dev/null  # no -q: an early exit is SIGPIPE
          scripts/dmg.sh
          # A versioned name: an appcast never names a DMG that a later build replaced.
          mv build/Rounds.dmg "build/Rounds-$ROUNDS_VERSION.dmg"

      - name: Sign the update and write the appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_ED_PRIVATE_KEY"
          SIGNATURE="$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file - "build/Rounds-$ROUNDS_VERSION.dmg")"
          # Notes: the commits since the last release.
          scripts/release-notes.sh "$TAG" HEAD "$GITHUB_REPOSITORY" > build/notes.md
          scripts/appcast.sh "$ROUNDS_VERSION" "$ROUNDS_SHORT_VERSION" "https://github.com/$GITHUB_REPOSITORY/releases/download/beta/Rounds-$ROUNDS_VERSION.dmg" "$SIGNATURE" build/notes.md > build/appcast.xml
          xmllint --noout build/appcast.xml
          swift scripts/verify-update.swift build/Rounds.app "build/Rounds-$ROUNDS_VERSION.dmg" build/appcast.xml

      - name: Publish the beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag "beta" follows the build; the release keeps its name and gets the new files.
          git tag -f beta && git push -f origin refs/tags/beta
          gh release view beta > /dev/null 2>&1 || gh release create beta --prerelease --latest=false --title "Rounds beta" --notes "Beta"
          # The DMG before the appcast that names it; then remove the DMGs of older builds.
          gh release upload beta "build/Rounds-$ROUNDS_VERSION.dmg" --clobber
          gh release upload beta build/appcast.xml --clobber
          gh release view beta --json assets --jq '.assets[].name' | grep -E '^Rounds(-.+)?\.dmg$' | grep -vxF "Rounds-$ROUNDS_VERSION.dmg" |
            while read -r NAME; do gh release delete-asset beta "$NAME" --yes; done
          gh release edit beta --prerelease --latest=false --title "Rounds $ROUNDS_SHORT_VERSION" --notes-file build/notes.md
