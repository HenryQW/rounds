name: Release

# A tag v<VERSION> (the VERSION file) builds Rounds, signed with the self-signed identity (no Developer ID), and
# publishes Rounds.dmg (the download, the cask and the Sparkle update, signed with SPARKLE_ED_PRIVATE_KEY) and
# appcast.xml on a GitHub release. With TAP_TOKEN set, the cask in HenryQW/homebrew-tap moves to this version. See
# website/docs/release.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
      SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the release notes need the previous tag and the commits since it

      - name: Check that the tag is the version
        run: |
          echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME"

      - name: Check the tap token
        if: env.TAP_TOKEN != ''
        # Before anything is published: an expired token would leave the cask on the old version.
        run: scripts/check-tap-token.sh 0

      - name: Test
        run: swift test

      - name: Import the signing identity
        run: |
          # A keychain for this run only, in the search list, so bundle.sh finds the identity and codesign can use it.
          test -n "$SIGNING_CERTIFICATE_P12" && test -n "$SIGNING_CERTIFICATE_PASSWORD"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASS="$(uuidgen)"
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          printf '%s' "$SIGNING_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/rounds.p12"
          security import "$RUNNER_TEMP/rounds.p12" -k "$KEYCHAIN" -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/rounds.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Build the app and the disk image
        run: |
          scripts/bundle.sh
          # The same identity as every release, or permissions and Sparkle's code signature check break on update.
          codesign -dvv build/Rounds.app 2>&1 | grep -x "Authority=Rounds Self-Signed" > /dev/null  # no -q: an early exit is SIGPIPE
          scripts/dmg.sh

      - name: Sign the update and write the appcast
        run: |
          # Sparkle checks the EdDSA signature: Rounds has no Developer ID to fall back on, so a release without the key
          # would strand every installed copy.
          test -n "$SPARKLE_ED_PRIVATE_KEY"
          # The sign_update of the Sparkle package that `swift build` fetched, so the tool matches the framework.
          SIGNATURE="$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file - build/Rounds.dmg)"
          cat > build/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Rounds</title>
              <item>
                <title>Rounds $VERSION</title>
                <pubDate>$(date -R)</pubDate>
                <sparkle:version>$VERSION</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>27.0</sparkle:minimumSystemVersion>
                <sparkle:releaseNotesLink>https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME</sparkle:releaseNotesLink>
                <enclosure url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Rounds.dmg" $SIGNATURE type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          EOF
          xmllint --noout build/appcast.xml
          # As each installed copy will: the signature against SUPublicEDKey, the length and the version.
          swift scripts/verify-update.swift build/Rounds.app build/Rounds.dmg build/appcast.xml

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes: the commits since the previous tag, grouped by type; the first release has no previous tag.
          PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            scripts/release-notes.sh "$PREV" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > build/notes.md
          else
            echo "First release." > build/notes.md
          fi
          gh release create "$GITHUB_REF_NAME" build/Rounds.dmg build/appcast.xml \
            --title "Rounds $VERSION" --notes-file build/notes.md

      - name: Update the Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          SHA256="$(shasum -a 256 build/Rounds.dmg | cut -d ' ' -f 1)"
          git clone "https://x-access-token:$TAP_TOKEN@github.com/HenryQW/homebrew-tap.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$SHA256/" packaging/homebrew/rounds.rb > "$RUNNER_TEMP/tap/Casks/rounds.rb"
          cd "$RUNNER_TEMP/tap"
          git add Casks/rounds.rb
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "rounds $VERSION"
          git push
